name: Build and deploy course site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out course source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Build student site with strict checks
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm run site:check; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "site:check failed after ${attempt} attempts"
              exit 1
            fi
            sleep_for=$((attempt * 10))
            echo "site:check failed on attempt ${attempt}; retrying in ${sleep_for} seconds..."
            sleep "$sleep_for"
          done

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
